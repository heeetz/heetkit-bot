# Explicit opt-in overlay: docker compose -f compose.yaml -f compose.management.yaml up -d
services:
  bot:
    command:
      - --health-file
      - /tmp/heetkit-health.json
      - --management-api
      - --management-host
      - 0.0.0.0
      - --management-allowed-host
      - "${HEETKIT_MANAGEMENT_LOOPBACK:-127.0.0.1}:8765"
    ports:
      - "${HEETKIT_MANAGEMENT_LOOPBACK:-127.0.0.1}:8765:8765"
    environment:
      HEETKIT_MANAGEMENT_TOKEN_FILE: /run/secrets/management_token
    secrets: [management_token]
secrets:
  management_token:
    file: ${HEETKIT_SECRETS_DIR:?Set HEETKIT_SECRETS_DIR to a private absolute directory}/management_token
