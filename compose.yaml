name: heetkit
services:
  bot:
    image: heetkit-headless:local
    build: .
    platform: "${HEETKIT_PLATFORM:-linux/amd64}"
    user: "10001:10001"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    environment:
      TWITCH_CLIENT_SECRET_FILE: /run/secrets/twitch_client_secret
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
    secrets: [twitch_client_secret, gemini_api_key]
    volumes:
      - profile:/var/lib/heetkit
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"
secrets:
  twitch_client_secret:
    file: ${HEETKIT_SECRETS_DIR:?Set HEETKIT_SECRETS_DIR to a private absolute directory}/twitch_client_secret
  gemini_api_key:
    file: ${HEETKIT_SECRETS_DIR:?Set HEETKIT_SECRETS_DIR to a private absolute directory}/gemini_api_key
volumes:
  profile:
