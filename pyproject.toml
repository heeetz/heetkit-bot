[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-bot-foundation"
version = "0.1.0"
description = "Scalable foundation for a Twitch chatbot."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "twitchio>=3.0,<4.0",
    "google-genai>=0.5.0,<1.0",
    "keyring>=25.0,<26.0",
    "pywebview>=6.0,<7.0",
    "pystray>=0.19,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[project.scripts]
twitch-bot = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.resources" = ["personalities.json"]
