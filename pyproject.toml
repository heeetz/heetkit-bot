[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "heetkit"
dynamic = ["version"]
description = "HeetKit — Desktop control center for Twitch chat"
authors = [{name = "heeetz"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "twitchio>=3.0,<4.0",
    "google-genai==1.75.0",
    "keyring>=25.0,<26.0",
    "pywebview>=6.0,<7.0",
    "pystray>=0.19,<1.0",
    "platformdirs>=4.0,<5.0",
    "regex==2026.9.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[project.scripts]
heetkit = "app.main:main"

[project.urls]
Repository = "https://github.com/heeetz/twitch-bot"
Issues = "https://github.com/heeetz/twitch-bot/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
version = {attr = "app.version.VERSION"}

[tool.setuptools]
py-modules = []
include-package-data = false
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "third_party_licenses/**/*"]

[tool.setuptools.package-data]
"app.resources" = [
    "*.json",
    "*.png",
    "*.ico",
    "*.icns",
    "filters/*.txt",
    "frontend/*.html",
    "frontend/*.png",
    "frontend/assets/*",
]
