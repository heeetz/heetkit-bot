name: Full validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit SHA (blank uses the workflow commit)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve selected commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Record immutable commit
        id: commit
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Selected commit: $sha" >> "$GITHUB_STEP_SUMMARY"

  validation:
    name: Python, production frontend and complete Edge suite
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Windows x64 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            packaging/python-bootstrap.txt
            packaging/windows/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          architecture: x64
          package-manager-cache: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Python runtime and test dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r packaging/python-bootstrap.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python installer bootstrap failed.' }
          python -m pip install --disable-pip-version-check -r packaging/windows/requirements.txt pytest==8.4.2 pytest-asyncio==0.26.0 PyYAML==6.0.3
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency check failed.' }
          python -c "from importlib.metadata import version; from packaging.version import Version; assert Version(version('urllib3')) >= Version('2.8.0'), 'urllib3 must be >= 2.8.0'"
          if ($LASTEXITCODE -ne 0) { throw 'urllib3 security version check failed.' }

      - name: Validate workflow and release inputs
        run: python scripts/ci_checks.py inputs

      - name: Run Python tests
        run: python -m pytest -q

      - name: Install frontend dependencies and check the production build
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed.' }

      - name: Ensure the frontend test browser is available
        working-directory: frontend
        run: |
          $edgeRoots = @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)})
          if ($env:HOMEDRIVE) { $edgeRoots += "$env:HOMEDRIVE\Program Files", "$env:HOMEDRIVE\Program Files (x86)" }
          $edgePaths = $edgeRoots |
            Where-Object { $_ } | ForEach-Object { Join-Path $_ 'Microsoft/Edge/Application/msedge.exe' }
          $installedEdge = $edgePaths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if ($installedEdge) {
            Write-Host "Using installed Microsoft Edge: $installedEdge"
          } else {
            npx --no-install playwright install msedge
            if ($LASTEXITCODE -ne 0) { throw 'Microsoft Edge installation failed.' }
          }

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --reporter=line --workers=2

  containers:
    needs: resolve
    uses: ./.github/workflows/linux-container.yml
    with:
      sha: ${{ needs.resolve.outputs.sha }}

  complete:
    name: Full validation result
    if: always()
    needs: [resolve, validation, containers]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha || github.sha }}
          persist-credentials: false
      - name: Report results and observed durations
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_checks.py finish

      - name: Record successful Full validation identity
        env:
          SELECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: python3 scripts/release_evidence.py record-full
      - uses: actions/upload-artifact@v6
        with:
          name: full-evidence-${{ github.run_attempt }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 14
