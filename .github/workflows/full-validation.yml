name: Full validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit SHA (blank uses the workflow commit)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve selected commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Record immutable commit
        id: commit
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Selected commit: $sha" >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Python suite and distribution inputs
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Set up Windows x64 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            packaging/python-bootstrap.txt
            packaging/windows/requirements.txt
      - name: Install pinned Python runtime and test dependencies
        id: python_dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r packaging/python-bootstrap.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python installer bootstrap failed.' }
          python -m pip install --disable-pip-version-check -r packaging/windows/requirements.txt pytest==8.4.2 pytest-asyncio==0.26.0 PyYAML==6.0.3
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency check failed.' }
          python -c "from importlib.metadata import version; from packaging.version import Version; assert Version(version('urllib3')) >= Version('2.8.0'), 'urllib3 must be >= 2.8.0'"
          if ($LASTEXITCODE -ne 0) { throw 'urllib3 security version check failed.' }
      - name: 'Inputs: workflow, distribution and release configuration'
        run: python scripts/ci_checks.py inputs
      - name: 'Test: complete Python suite'
        if: "!cancelled() && steps.python_dependencies.outcome == 'success'"
        id: pytest
        run: python -m pytest -q --junitxml "$env:RUNNER_TEMP/heetkit-python-junit.xml"
      - name: Upload Python failure report
        if: failure() && steps.pytest.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: full-python-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/heetkit-python-junit.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Production frontend and complete Edge suite
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Set up Windows x64 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            packaging/python-bootstrap.txt
            packaging/windows/requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          architecture: x64
          package-manager-cache: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: 'Build: production frontend and TypeScript'
        working-directory: frontend
        run: npm run build
      - name: Install pinned Python runtime for the Server browser fixture
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r packaging/python-bootstrap.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python installer bootstrap failed.' }
          python -m pip install --disable-pip-version-check -r packaging/windows/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency check failed.' }
          python -c "from importlib.metadata import version; from packaging.version import Version; assert Version(version('urllib3')) >= Version('2.8.0'), 'urllib3 must be >= 2.8.0'"
          if ($LASTEXITCODE -ne 0) { throw 'urllib3 security version check failed.' }
      - name: Ensure Microsoft Edge is available
        working-directory: frontend
        run: |
          $edgeRoots = @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)})
          if ($env:HOMEDRIVE) { $edgeRoots += "$env:HOMEDRIVE\Program Files", "$env:HOMEDRIVE\Program Files (x86)" }
          $edgePaths = $edgeRoots |
            Where-Object { $_ } | ForEach-Object { Join-Path $_ 'Microsoft/Edge/Application/msedge.exe' }
          $installedEdge = $edgePaths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if ($installedEdge) {
            Write-Host "Using installed Microsoft Edge: $installedEdge"
          } else {
            npx --no-install playwright install msedge
            if ($LASTEXITCODE -ne 0) { throw 'Microsoft Edge installation failed.' }
          }
      - name: 'Test: complete Edge browser suite'
        id: browser_tests
        working-directory: frontend
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ runner.temp }}/heetkit-browser-junit.xml
        run: npm test -- '--reporter=line,junit' --workers=2 --trace=retain-on-failure
      - name: Upload browser failure reports and attachments
        if: failure() && steps.browser_tests.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: full-browser-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/heetkit-browser-junit.xml
            frontend/node_modules/.tmp/playwright-results/**/trace.zip
            frontend/node_modules/.tmp/playwright-results/**/test-failed-*.png
          # Limit hidden-path upload to the exact Playwright output patterns above.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  containers:
    needs: resolve
    uses: ./.github/workflows/linux-container.yml
    with:
      sha: ${{ needs.resolve.outputs.sha }}

  complete:
    name: Full validation result
    if: always()
    needs: [resolve, python, frontend, containers]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha || github.sha }}
          persist-credentials: false
      - name: Report required checks, failures and durations
        env:
          SELECTED_SHA: ${{ needs.resolve.outputs.sha }}
          CI_RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_checks.py finish

      - name: Record successful Full validation identity
        env:
          SELECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: python3 scripts/release_evidence.py record-full
      - uses: actions/upload-artifact@v6
        with:
          name: full-evidence-${{ github.run_attempt }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 14
