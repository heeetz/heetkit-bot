name: Native Linux container checks

on:
  workflow_call:
    inputs:
      sha:
        description: Immutable commit resolved by Full validation
        required: true
        type: string

permissions:
  contents: read

jobs:
  container:
    name: Container (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      HEETKIT_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Build and validate disposable Linux container
        run: python3 scripts/check_linux_container.py
