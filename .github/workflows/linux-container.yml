name: Linux container

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'frontend/src/**'
      - 'frontend/public/icon.png'
      - 'frontend/package*.json'
      - 'frontend/tsconfig*.json'
      - 'frontend/index.html'
      - 'frontend/vite.config.ts'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'packaging/linux/**'
      - 'scripts/check_linux_container.py'
      - 'tests/fixtures/headless_container.py'
      - '.github/workflows/linux-container.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    name: Container (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      HEETKIT_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and validate disposable Linux container
        run: python3 scripts/check_linux_container.py
