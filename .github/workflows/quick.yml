name: Quick

# Always report a result, including prose-only pushes. Do not use workflow path filters:
# skipped workflows can leave a required check pending indefinitely.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select Quick checks
    runs-on: ubuntu-24.04
    outputs:
      smoke: ${{ steps.plan.outputs.smoke }}
      typecheck: ${{ steps.plan.outputs.typecheck }}
      inputs: ${{ steps.plan.outputs.inputs }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select fixed check groups for the whole push
        id: plan
        run: python3 scripts/ci_checks.py plan

  smoke:
    name: Python smoke
    needs: plan
    if: needs.plan.outputs.smoke == 'true'
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            packaging/python-bootstrap.txt
            packaging/windows/requirements.txt
      - name: Install pinned runtime and smoke test tools
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r packaging/python-bootstrap.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python installer bootstrap failed.' }
          python -m pip install --disable-pip-version-check -r packaging/windows/requirements.txt pytest==8.4.2 pytest-asyncio==0.26.0
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency check failed.' }
          python -c "from importlib.metadata import version; from packaging.version import Version; assert Version(version('urllib3')) >= Version('2.8.0')"
          if ($LASTEXITCODE -ne 0) { throw 'urllib3 security version check failed.' }
      - name: Run the fixed Python smoke set
        run: python scripts/ci_checks.py smoke

  typecheck:
    name: TypeScript
    needs: plan
    if: needs.plan.outputs.typecheck == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check TypeScript without a production build
        working-directory: frontend
        run: npm run typecheck

  inputs:
    name: Workflow and release inputs
    needs: plan
    if: needs.plan.outputs.inputs == 'true'
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
          architecture: x64
      - name: Install workflow test tools only
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r packaging/python-bootstrap.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python installer bootstrap failed.' }
          python -m pip install --disable-pip-version-check pytest==8.4.2 PyYAML==6.0.3
          if ($LASTEXITCODE -ne 0) { throw 'Workflow test dependency installation failed.' }
      - name: Validate machine-consumed inputs
        run: python scripts/ci_checks.py inputs
      - name: Exercise selection, orchestration and publication guards
        run: python -m pytest -q tests/test_ci_workflows.py tests/test_release_publication.py tests/test_release_evidence.py

  complete:
    name: Quick result
    if: always()
    needs: [plan, smoke, typecheck, inputs]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report results, skip reasons and observed durations
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_checks.py finish
