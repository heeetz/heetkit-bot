name: Build candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit SHA to package (blank uses the workflow commit)'
        required: false
        type: string

# Candidate builds never publish and remain read-only.
permissions:
  contents: read

jobs:
  resolve:
    name: Resolve selected commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag_ref: ${{ steps.commit.outputs.tag_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Record immutable commit
        id: commit
        env:
          SELECTED_REF: ${{ inputs.ref || github.sha }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Selected commit: $sha" >> "$GITHUB_STEP_SUMMARY"
          selected=$(git rev-parse --symbolic-full-name "$SELECTED_REF")
          if [[ "$selected" == refs/tags/* ]]; then
            echo "tag_ref=$selected" >> "$GITHUB_OUTPUT"
          fi

  windows-build:
    name: Test and package Windows x64
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Windows x64 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            packaging/python-bootstrap.txt
            packaging/windows/requirements.txt

      - name: Set up Node for the existing frontend builder
        uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          architecture: x64
          package-manager-cache: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Read canonical application version and validate release tag
        id: version
        env:
          SELECTED_TAG: ${{ needs.resolve.outputs.tag_ref }}
        run: |
          $metadata = @(python -c "from app.version import VERSION, is_prerelease; print(VERSION); print(str(is_prerelease()).lower())")
          if ($LASTEXITCODE -ne 0 -or $metadata.Count -ne 2) { throw 'Cannot validate the canonical application version.' }
          $version, $prerelease = $metadata
          if ($env:SELECTED_TAG) {
            if ($env:SELECTED_TAG -cne "refs/tags/v$version") {
              throw "Release tag '$env:SELECTED_TAG' must match canonical version 'v$version'."
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Build, inspect and archive the standalone application
        id: build
        # Owns the isolated pinned venv, npm ci/build, licenses, PyInstaller,
        # integrity checks, portable ZIP and ZIP SHA-256 sidecar.
        run: python scripts/build_windows.py

      - name: Install test tools in the builder environment
        env:
          BUILDER_PYTHON: ${{ steps.build.outputs.python }}
        # Add test tools only after license collection/freezing; never ship them.
        run: |
          & $env:BUILDER_PYTHON -m pip install --disable-pip-version-check pytest==8.4.2 pytest-asyncio==0.26.0
          if ($LASTEXITCODE -ne 0) { throw 'Python test dependency installation failed.' }
          & $env:BUILDER_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency check failed.' }
          # The shared requirements pin the version; enforce the patched urllib3 minimum.
          & $env:BUILDER_PYTHON -c "from importlib.metadata import version; from packaging.version import Version; resolved = version('urllib3'); print(f'urllib3 {resolved}'); assert Version(resolved) >= Version('2.8.0'), 'urllib3 must be >= 2.8.0'"
          if ($LASTEXITCODE -ne 0) { throw 'urllib3 security version check failed.' }

      - name: Run packaging, prerequisite and profile isolation tests
        env:
          BUILDER_PYTHON: ${{ steps.build.outputs.python }}
        run: >-
          & $env:BUILDER_PYTHON -m pytest -q
          tests/test_windows_packaging.py
          tests/test_windows_installer.py
          tests/test_windows_runtime.py
          tests/test_runtime_distribution.py
          tests/test_profile_isolation.py
          tests/test_release_publication.py
          tests/test_release_evidence.py

      - name: Install the pinned Inno Setup compiler
        id: inno
        run: |
          $innoVersion = python -c "from scripts.build_installer import INNO_VERSION; print(INNO_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the installer compiler version.' }
          $tag = 'is-' + $innoVersion.Replace('.', '_')
          $download = Join-Path $env:RUNNER_TEMP "innosetup-$innoVersion.exe"
          $toolchain = Join-Path $env:RUNNER_TEMP "inno-$innoVersion"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$innoVersion.exe" -OutFile $download
          # Digest of the official 6.7.3 release asset, verified before execution.
          $expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Inno Setup download checksum mismatch.'
          }
          $setup = Start-Process -FilePath $download -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$toolchain`"") -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup installation failed ($($setup.ExitCode))." }
          $compiler = Join-Path $toolchain 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Inno Setup compiler missing.' }
          # HeetKit.iss also rejects a compiler that is not exactly 6.7.3.
          "compiler=$compiler" >> $env:GITHUB_OUTPUT

      - name: Ensure the frontend test browser is available
        working-directory: frontend
        # Match Playwright's Windows msedge lookup; reuse the runner's browser.
        run: |
          $edgeRoots = @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)})
          if ($env:HOMEDRIVE) { $edgeRoots += "$env:HOMEDRIVE\Program Files", "$env:HOMEDRIVE\Program Files (x86)" }
          $edgePaths = $edgeRoots |
            Where-Object { $_ } | ForEach-Object { Join-Path $_ 'Microsoft/Edge/Application/msedge.exe' }
          $installedEdge = $edgePaths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if ($installedEdge) {
            Write-Host "Using installed Microsoft Edge: $installedEdge"
          } else {
            npx --no-install playwright install msedge
            if ($LASTEXITCODE -ne 0) { throw 'Microsoft Edge installation failed.' }
          }

      - name: Run frontend tests using the builder-installed dependencies
        working-directory: frontend
        env:
          HEETKIT_TEST_PYTHON: ${{ steps.build.outputs.python }}
        run: npm test -- --reporter=line --workers=2

      - name: Build installer from the verified portable ZIP
        env:
          INNO_COMPILER: ${{ steps.inno.outputs.compiler }}
          BUILDER_PYTHON: ${{ steps.build.outputs.python }}
        # Reuses bundle inspection and writes the installer SHA-256/traceability.
        run: '& $env:BUILDER_PYTHON scripts/build_installer.py --inno-compiler "$env:INNO_COMPILER"'

      - name: Verify all expected outputs before upload
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $base = "HeetKit-$env:APP_VERSION-windows-x64"
          foreach ($suffix in @('.zip', '.zip.sha256', '-setup.exe', '-setup.exe.sha256', '-setup.exe.build.json')) {
            $path = Join-Path 'dist' "$base$suffix"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing artifact: $path" }
          }

      - name: Upload application artifacts and script-generated checksums
        id: candidate
        uses: actions/upload-artifact@v6
        with:
          name: HeetKit-${{ steps.version.outputs.version }}-windows-x64
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          # Exact outputs only: never upload the checkout, build trees or profiles.
          path: |
            dist/HeetKit-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/HeetKit-${{ steps.version.outputs.version }}-windows-x64.zip.sha256
            dist/HeetKit-${{ steps.version.outputs.version }}-windows-x64-setup.exe
            dist/HeetKit-${{ steps.version.outputs.version }}-windows-x64-setup.exe.sha256
            dist/HeetKit-${{ steps.version.outputs.version }}-windows-x64-setup.exe.build.json

      - name: Report observed candidate durations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_checks.py durations

      - name: Record candidate identity after successful checks and upload
        env:
          SELECTED_SHA: ${{ needs.resolve.outputs.sha }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
        run: python scripts/release_evidence.py record-candidate

      - uses: actions/upload-artifact@v6
        with:
          name: candidate-evidence-${{ github.run_attempt }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 14
