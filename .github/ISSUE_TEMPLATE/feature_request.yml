name: Feature request
description: Suggest an improvement to Twitch Bot.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow or need without private user data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the change and any alternatives you considered.
    validations:
      required: true
